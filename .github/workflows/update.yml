name: update

# Щогодини: доваантажити нові пости, перебудувати сайт, опублікувати.
#
# Годинник тут НЕ живе. Щогодинний тік дає Worker `tgmine-cron` на Cloudflare
# через `workflow_dispatch` — див. cron/ і DEPLOY.md, крок 4. Причина: подія
# `schedule` у GitHub депріоритезована й під навантаженням просто відкидається.
# Заміряно на цьому репозиторії: з 24 липня по 25 серпня черга ще тримала 23
# прогони на добу, 26-го видала 17, а з 27-го обвалилась до 3-6. Прогони, що
# таки стартують, ідуть миттєво (created_at == run_started_at) — тобто GitHub
# не створює саму подію, а не ставить її в чергу.
#
# `schedule` нижче лишається ЗАПОБІЖНИКОМ на випадок смерті Worker, тому раз
# на 6 годин, а не щогодини. Тримати тут годину, коли годинник живий, означає
# подвоїти всі прогони: 24 dispatch + 24 schedule = ~2900 хв/міс проти 2000
# безкоштовних на приватному репозиторії.
#
# Чому саме 6 годин: помер Worker — свіжість просідає до чотирьох разів на
# добу, це помітно, але сайт не стає намертво. Дані при цьому не губляться,
# `sync.py --since 2d` добирає пропущене — страждає лише свіжість.
#
# Як перевірити, що годинник живий:
#   gh run list --limit 40 --json event -q '[.[].event] | group_by(.)
#     | map({event: .[0], n: length})'
# Нема `workflow_dispatch` — Worker мовчить, конвеєр живе на запобіжнику.
on:
  schedule:
    # :30, а не :00 — Worker б'є рівно о годині, і збіг давав би два прогони
    # в одну хвилину. Група concurrency їх не злила б: `cancel-in-progress:
    # false` ставить другий у чергу, тож обидва відпрацьовують і обидва
    # тарифікуються.
    - cron: "30 */6 * * *"
  workflow_dispatch:          # кнопка «запустити зараз» у вкладці Actions
    inputs:
      trigger:
        description: "Хто запустив: cron (Worker) чи людина"
        required: false
        default: "manual"
  push:
    branches: [main]

permissions:
  contents: write             # щоб бот міг комітити оновлені дані
  pages: write
  id-token: write
  actions: read               # запобіжник дивиться, коли востаннє стріляв Worker

concurrency:
  group: update
  cancel-in-progress: false   # не обривати збір на півдорозі

jobs:
  # Запобіжник має ПЕРЕВІРЯТИ годинник, а не дублювати його роботу.
  #
  # Поки Worker стріляє щогодини, шестигодинний `schedule` — це четвертий
  # зайвий повний прогін на добу. Заміряно: прогін коштує 3 білінгові хвилини
  # (медіана 129 с, GitHub округлює вгору), тобто 12 хв/добу = 360 хв/міс із
  # 2000 безкоштовних витрачались на повторення того, що вже зроблено годину
  # тому.
  #
  # Тепер запобіжник спершу питає GitHub, коли востаннє був
  # `workflow_dispatch`. Свіжий — виходимо за десяток секунд (1 хвилина
  # замість 3). Мовчить понад 90 хвилин — Worker мертвий, і повний прогін
  # відпрацьовує як раніше. Шість годин між перевірками лишились: свіжість при
  # смерті годинника не просіла.
  #
  # Помилка тут ЗАВЖДИ трактується на користь роботи: не відповів API, збився
  # формат дати, впав крок — далі йде повний прогін. Тихо пропустити
  # запобіжник страшніше, ніж витратити зайві дві хвилини.
  clock:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          row=$(gh api \
            "/repos/${{ github.repository }}/actions/runs?event=workflow_dispatch&per_page=1" \
            --jq '.workflow_runs[0] | "\(.created_at) \(.conclusion // "running")"')
          last=${row%% *}
          verdict=${row##* }
          if [ -z "$row" ] || [ -z "$last" ]; then
            echo "::warning::не вдалось спитати про останній workflow_dispatch — працюємо як повний прогін"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          then=$(date -u -d "$last" +%s 2>/dev/null)
          if [ -z "$then" ]; then
            echo "::warning::не розібрав дату '$last' — працюємо як повний прогін"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( $(date -u +%s) - then ))
          echo "останній тік Worker: $last ($((age / 60)) хв тому), підсумок: $verdict"
          # Мало щоб годинник стріляв — його прогони мають ЗАКІНЧУВАТИСЬ добре.
          # Інакше вийшло б навпаки: конвеєр падає щогодини, запобіжник бачить
          # свіжий тік і мовчки виходить зеленим, а лист про збій розкладу
          # (єдине, що GitHub шле сам) більше не приходить.
          if [ "$age" -gt 5400 ]; then
            echo "::warning::годинник мовчить понад 90 хв — запобіжник бере роботу на себе"
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$verdict" != "success" ] && [ "$verdict" != "running" ]; then
            echo "::warning::останній прогін годинника завершився як '$verdict' — працюємо повністю"
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "годинник живий — повний прогін не потрібен"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [clock]
    runs-on: ubuntu-latest
    # Крок збору ходить у мережу й повторює запити з backoff — єдине місце, що
    # може зависнути надовго. Виміряно локально: тести 7 с, збірка сайту 28 с,
    # ранжування <1 с. Двадцять хвилин — десятикратний запас, але менше за
    # інтервал крону (година), тому зависла спроба звільнить чергу до наступної.
    # Дефолт GitHub — 360 хв, і з `cancel-in-progress: false` одна зависла
    # спроба блокувала б групу на шість годин.
    timeout-minutes: 20
    # Бот комітить дані в main, а `on: push` реагує на main. Зараз петлі нема:
    # GitHub не перезапускає workflow на події від GITHUB_TOKEN. Але варто
    # замінити токен на PAT чи deploy key (типово — коли вмикають захист гілки),
    # і кожен коміт бота запускав би нову збірку. Явна умова не залежить від
    # цієї неочевидної поведінки.
    #
    # `always()` тут обовʼязковий: на всіх подіях, крім `schedule`, job `clock`
    # ВЗАГАЛІ не запускається, а `needs` на пропущений job без нього гасить і
    # цей. `result != 'success'` — та сама відмова на користь роботи: clock
    # упав або не стартував, значить перевірки не було, значить працюємо.
    if: >-
      always()
      && (github.event_name != 'push' || github.actor != 'github-actions[bot]')
      && (github.event_name != 'schedule'
          || needs.clock.result != 'success'
          || needs.clock.outputs.go == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Драйвер злиття для data/ і store/. `.gitattributes` його називає, але
      # `git clone` конфіг не переносить, і в клоні CI його не було НІКОЛИ.
      # Наслідок: коли оператор пушить у main під час прогону, `git pull
      # --rebase` у кроці збереження впирається в конфлікт на store/*.jsonl,
      # злити його нема чим, і всі три спроби пушу приречені (прогін
      # 33765349380, 2026-09-03 14:13 UTC: «Pulling is not possible because
      # you have unmerged files»). Дані не губляться — наступний прогін
      # перезбирає за дві доби — але прогін падає, і сайт того часу не
      # оновлюється. Ідемпотентно, перевірено на свіжому клоні.
      - run: python3 mergejsonl.py --install

      # Газетир 132 МБ — у репозиторії йому не місце. Кешуємо між запусками,
      # завантажуємо лише коли кеш порожній.
      - name: Кеш газетира
        id: gaz
        uses: actions/cache@v4
        with:
          path: gazetteer
          key: gazetteer-v1

      - name: Завантажити газетир
        if: steps.gaz.outputs.cache-hit != 'true'
        run: |
          mkdir -p gazetteer && cd gazetteer
          curl -sL -o RU.zip https://download.geonames.org/export/dump/RU.zip
          curl -sL -o UA.zip https://download.geonames.org/export/dump/UA.zip
          curl -sL -o ne.zip https://naciscdn.org/naturalearth/10m/cultural/ne_10m_admin_1_states_provinces.zip
          unzip -oq RU.zip && unzip -oq UA.zip && unzip -oq ne.zip
          rm -f *.zip

      - name: Межі областей
        run: test -f regions.json || python mkregions.py

      # Тести — до збору. Якщо розбір зламано, краще не писати зіпсовані події
      # у store і не публікувати сайт: дані в data/ не відновлюються.
      #
      # На кроні набір урізаний, і це не економія заради економії. Виміряно по
      # модулях: із 24 с локального прогону 22 с — це test_geocode (14.9 с,
      # вантажить газетир 132 МБ) і test_territory (6.9 с, полігони Natural
      # Earth). Обидва перевіряють КОД проти СТАТИЧНОГО довідника, а на кроні ні
      # код, ні газетир не відрізняються від попереднього зеленого прогону —
      # тобто відповідь відома наперед. Решта модулів разом 1.3 с і тримають
      # інваріанти розбору й сховища; саме вони той запобіжник, що не пускає
      # зіпсовані події в store.
      #
      # Повний набір ганяється на push і на ручному запуску — тобто щоразу, коли
      # код МІГ змінитись. Правило: додаєш тест, який залежить від газетира —
      # клади його в test_geocode/test_territory, інакше він тихо зникне з
      # швидкого набору.
      #
      # Умова дивиться не лише на `schedule`. Відколи розклад переїхав у Worker,
      # регулярний тік приходить як `workflow_dispatch`, і прив'язка до
      # `schedule` мовчки повернула повний набір на кожен годинний прогін:
      # виміряно 133 с проти 102 с, тобто 3 білінгові хвилини замість 2 —
      # +720 хв/міс на порожньому місці. Worker шле `trigger: cron`, кнопка в
      # інтерфейсі лишає дефолт `manual` і повний набір.
      - name: Тести (повні)
        if: github.event_name != 'schedule' && github.event.inputs.trigger != 'cron'
        run: python -m unittest discover -s tests -t . -v

      # На клоці лишаються рівно ті тести, які МОЖУТЬ спрацювати.
      #
      # Між двома тіками годинника не міняється ні код (він приїжджає лише
      # пушем, а на пуші ганяється повний набір), ні середовище (версії в
      # requirements.txt прибиті точно). Міняється саме сховище — тож сенс має
      # перевіряти його, а не код. Урізаний набір із пʼяти модулів коштував
      # 17 с щогодини й у 12 з них міг лише повторити відповідь останнього
      # зеленого пуша.
      #
      # Лишились два класи, обидва читають store/events і падають на
      # зіпсованих подіях: дублі id, порожні дати, привʼязка цілі до
      # обласного фолбеку. Заміряно локально: 14.7 с -> 5.5 с.
      - name: Інваріанти сховища
        if: github.event_name == 'schedule' || github.event.inputs.trigger == 'cron'
        run: |
          python -m unittest -v \
            tests.test_store.TestStoreInvariants \
            tests.test_store.TestNearNeedsARealCoordinate

      # Пости приносить ГОДИННИК, а не пуш. Прогін на пуш збирав їх теж:
      # 20 с мережі й коміт даних на кожну правку коду. Це не лише хвилини —
      # це ще й гонка за пуш у main між ботом і людиною, яка вже валила
      # публікацію (прогін 33765349380, 3 вересня). Сайт від цього не
      # застаріває: наступний тік годинника через ≤60 хв бере `--since 2d`
      # і добирає все, що пропущено.
      - name: Зібрати нові пости
        if: github.event_name != 'push'
        run: python sync.py --since 2d

      - name: Дата для ключа кешу
        id: cachekey
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Жар цілей рахується РАЗ НА ДОБУ, а не щопрогону.
      #
      # Не заради процесора (rank_targets < 1 с), а заради байтів: targets.json
      # важить 0.8 МБ, hits зсувається майже щоразу, і хостинг перезаливав його
      # 24 рази на добу. Жар за годину не змінюється помітно — це лік за 93
      # доби, одна година додає долі відсотка.
      #
      # Кеш, а не коміт: 0.8 МБ щодня в історію git — 290 МБ за рік.
      # Дата в ключі дає рівно один перерахунок на добу, решту прогонів файл
      # береться з кешу байт-у-байт, тож хостинг його не вантажить узагалі.
      - name: Кеш ранжування цілей (відновити)
        uses: actions/cache/restore@v4
        with:
          path: .rank
          key: rank-${{ steps.cachekey.outputs.day }}

      - name: Важливість цілей
        run: |
          if [ ! -f targets.json ]; then
            echo "targets.json нема — пропускаю, карти будуть без шару цілей"
          elif [ -f .rank/targets.json ]; then
            cp .rank/targets.json targets.json
            echo "жар узято з кешу за $(date -u +%F) — перерахунок раз на добу"
          else
            python rank_targets.py
            mkdir -p .rank && cp targets.json .rank/targets.json
          fi

      # Карти нальотів історичні: карта позавчорашньої ночі більше не змінюється,
      # але коштує 3.6 с і 0.6 МБ. Будувати всі 88 щогодини — 5.5 хвилини на
      # прогін, тобто ~5000 хв/міс проти 2000 безкоштовних. Тому вони переїжджають
      # між прогонами кешем, а site.py перебудовує лише свіжі.
      #
      # Кеш обовʼязковий, а не оптимізація: `wrangler pages deploy site` публікує
      # рівно те, що в теці. Якби карти не відновлювались, кожен прогін зносив
      # би з сайту весь архів, лишаючи останні дві ночі.
      #
      # Ключ на добу, не на прогін: 53 МБ × 24 прогони щодня забили б 10-гігабайтну
      # квоту кешу за тиждень. `restore-keys` підхоплює вчорашній, коли сьогодні
      # ще нічого не збережено.
      # ВЕРСІЯ В КЛЮЧІ (raids-vN) — не прикраса. Карти беруться з кешу й НЕ
      # перебудовуються, тож зміна вигляду чи розмітки в makeraid.py/raid.py
      # доходить лише до свіжих двох діб, а решта архіву назавжди лишається
      # старою. Помітити це на око майже неможливо: сторінки різні, дати різні.
      # Правило: змінив makeraid.py або raid.py — підніми vN тут же, у тому
      # самому коміті. І не лише їх: 3 вересня 2026 сховище перезібрали під
      # нові правила розбору, а карти й ночі для редактора лишились у кеші зі
      # СТАРОГО сховища — свіжими були лише дві останні доби, решта 137 ночей
      # на хостингу показували дані до перебудови. Перебудова store/ — теж
      # причина підняти версію (v5 -> v6). v7 — вектори руху навчились
      # відновлювати джерело (район, область, прийменник), а вектори йдуть у
      # raid_*.json і далі в маршрути ночей для редактора. v8 — з векторів знято
      # фолбек на центроїд області (він пускав центроїди в маршрути редактора).
      # v9 — нечіткі дублі дзеркала: унікальних подій −10%, карти ночей інші.
      # v10 — глибина від підконтрольної України замість ламаної з 8 точок;
      # пунктир на картах нальоту — той самий контур. v11 — глибина рахується
      # гаверсинусом до проєкції на відрізок (було рівнокутне наближення:
      # 53% глибин зсунулись, медіана 2 км, на Уралі до 99). Один холодний прогін ~4.5 хв, далі знову ~18 с.
      # v12 — Урал, Західний Сибір і Дагестан: 9 нових областей у конфізі,
      # геокод без рамки при відомій області, сховище перезібране (844 події
      # отримали координати, 643 змінили; жодна європейська не втрачена).
      # v13 — крапка не ставиться на джерело («от <області>»). v14 — курс
      # словами («на восток») у подіях і стрілки з нього в ночах редактора. v15 —
      # курс лише з початку тексту й без «на юг от X»: змінені ночі.
      # v16 — фіксації ночі в ночах редактора (усі місця, де щось бачили).
      # v17 — старти тривог у тилу в ночах редактора.
      #
      # RESTORE І SAVE РОЗНЕСЕНІ НАВМИСНО — це не стилістика. `actions/cache`
      # одним кроком зберігає кеш у post-дії, а вона НЕ зберігає нічого, якщо
      # job впав. Спостережено на цьому репозиторії 20-24 липня: деплой почав
      # падати на 403 від хостингу → кеш карт не зберігався → наступний прогін
      # будував усі 98 діб з нуля (268 с) → знову падав → знову не зберігав.
      # Медіана прогону 1.8 хв перетворилась на 8.5, тобто ~3100 хв/міс проти
      # 2000 безкоштовних, і помітити це можна було лише глянувши в білінг.
      #
      # Окремий save з `always()` розриває звʼязок: карти зберігаються одразу
      # після збірки сайту, ще до кроку публікації, тож поломка публікації
      # більше не робить наступні прогони холодними.
      # Разом із картами кешуються дані ночей для редактора
      # (site/mapper/nights). Без цього кожен прогін не знаходив би їх на
      # диску й перебудовував усі 131 ніч — це вісім хвилин замість вісімнадцяти
      # секунд, тобто вихід за безкоштовні хвилини за кілька діб.
      - name: Кеш карт нальотів (відновити)
        uses: actions/cache/restore@v4
        with:
          path: |
            site/raids
            site/mapper/nights
          key: raids-v19-${{ steps.cachekey.outputs.day }}
          restore-keys: raids-v19-

      # Без --days: денні сторінки за всі 93 доби коштують 6 секунд, тобто
      # обрізання архіву економило час не там, де він витрачався. --raid-days 2
      # перебудовує лише ті ночі, дані по яких ще доходять; решта береться з кешу.
      - name: Зібрати сайт
        run: python site.py --raids --raid-days 2

      # Одразу після збірки, ДО публікації — див. пояснення біля restore.
      # continue-on-error: за день кеш із цим ключем уже міг зберегтись, тоді
      # save лається «cache already exists». Це нормальний стан, а не збій.
      - name: Кеш карт нальотів (зберегти)
        if: always() && hashFiles('site/raids/**') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            site/raids
            site/mapper/nights
          key: raids-v19-${{ steps.cachekey.outputs.day }}

      - name: Кеш ранжування цілей (зберегти)
        if: always() && hashFiles('.rank/**') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .rank
          key: rank-${{ steps.cachekey.outputs.day }}

      # Пуш бота падав, коли поки прогін ішов, у main зʼявився чужий коміт:
      # `! [rejected] main -> main (fetch first)`. Це не рідкість — прогін
      # триває близько двох хвилин. Наслідок був не «дані трохи запізнились»,
      # а повний провал: крок публікації йде ПІСЛЯ цього, тож сайт не
      # оновлювався зовсім. Тому три спроби з rebase між ними.
      - name: Зберегти дані в репозиторій
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data store regions.json
          if git diff --staged --quiet; then
            echo "нових даних нема"
            exit 0
          fi
          git commit -m "дані: $(date -u +%F\ %H:%M) UTC"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "пуш відхилено, спроба $i — підтягую main і повторюю"
            # Якщо злити все ж не вдалось — повернутись на гілку, інакше
            # наступні спроби стоять у detached HEAD і не можуть нічого.
            git pull --rebase --autostash origin main || { git rebase --abort || true; }
            sleep $((i * 5))
          done
          echo "::error::не вдалося запушити дані після трьох спроб"
          exit 1

      # `npx --yes wrangler@4` щопрогону тягне пакет із реєстру — це ~12 с із
      # 107 с прогону. Ключ статичний: мажорна версія прибита, тож кеш
      # заповнюється один раз і далі тільки читається.
      - name: Кеш npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-wrangler-4

      # Публікація на Cloudflare Pages, а не GitHub Pages: безкоштовний Pages
      # роздає лише з публічного репозиторію, а тут у `data/` лежать сирі пости
      # й уся логіка відбору — репозиторій лишається приватним.
      #
      # Cloudflare тут НЕ звʼязаний з Git (режим Direct Upload). Звʼязка через
      # дашборд виглядає простіше, але робить дві шкідливі речі: (1) `site/` у
      # .gitignore, тому хостинг публікує корінь репо — тобто віддає приватні
      # дані по HTTP; (2) білд на кожен push, а бот комітить дані 24 рази на
      # добу. Тека їде готовою звідси, де вже є Python, газетир і store.
      #
      # Чому Cloudflare, а не Netlify: 24 деплої на добу = ~720 на місяць, а
      # безкоштовний план дає 500 БІЛДІВ на місяць. Direct Upload у ту квоту не
      # входить — вона рахує лише збірки на боці Cloudflare, а тут заливається
      # готова тека. Плюс безлімітний трафік замість 100 ГБ/міс у Netlify.
      # Ліміти на розмір із запасом: 20 000 файлів на проєкт (тут 1033 — росте
      # на ~2 файли за ніч, карта нальоту й дані редактора), 25 МіБ
      # на файл (найбільший — mapper/basemap.js, 2.2 МБ).
      #
      # Умова на env, а не на vars: крок сам вимикається, доки секрета нема, і
      # вмикається тієї ж миті, коли той зʼявиться — без ще однієї ручної дії.
      # Через vars довелося б памʼятати про другий перемикач, а забутий
      # PUBLISH_SITE при вже покладеному токені виглядає точнісінько як
      # робочий конвеєр, що мовчки нічого не публікує.
      #
      # Секрет не можна читати в `if` напряму (контекст secrets там недоступний),
      # тому він спершу кладеться в env кроку — цей контекст в `if` видно.
      - name: Публікація на Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CF_PAGES_PROJECT != ''
        # `project create` — ідемпотентність, а не глушення помилок: на вже
        # створеному проєкті команда падає з «project already exists», і це
        # нормальний стан 99% прогонів. Справжня відмова (нема прав, збитий
        # токен) все одно вилізе наступним кроком — `deploy` на неіснуючому
        # проєкті червоний.
        #
        # --branch=main обовʼязковий. Без нього wrangler вгадує гілку з git, і
        # деплой, що не збігся з production-гілкою проєкту, тихо стає preview:
        # прогін зелений, у логах є URL, а бойовий домен показує старе.
        #
        # --commit-dirty: `site/` у .gitignore, тому дерево завжди «брудне» —
        # без прапорця wrangler сипле попередження щопрогону.
        run: |
          npx --yes wrangler@4 pages project create "$CF_PAGES_PROJECT" \
            --production-branch=main || true
          npx --yes wrangler@4 pages deploy site \
            --project-name="$CF_PAGES_PROJECT" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT:      ${{ secrets.CF_PAGES_PROJECT }}

      - name: Чому не опубліковано
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.CF_PAGES_PROJECT == ''
        run: |
          echo "::notice::Сайт зібрано, але не опубліковано — нема секрета" \
               "CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID або CF_PAGES_PROJECT." \
               "Прогін зелений навмисно: червоні прогони щогодини сховали б" \
               "справжній збій."
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT:      ${{ secrets.CF_PAGES_PROJECT }}
