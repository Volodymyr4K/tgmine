name: update

# Щогодини: доваантажити нові пости, перебудувати сайт, опублікувати.
#
# Чому година, а не півгодини. Репозиторій приватний, там 2000 безкоштовних
# хвилин Actions на місяць, а прогін (1м22с) округлюється вгору до 2 хв.
# Кожні 30 хв = 48 запусків = ~2980 хв/міс, тобто перебір на ~1000 хв. Година
# дає ~1490 хв — 74% ліміту із запасом на ручні прогони.
#
# Свіжість від цього майже не страждає: заявлені 30 хв GitHub однаково не
# тримає. Виміряно на реальних прогонах — 12:01, 14:03, 15:31 UTC, тобто
# фактичний інтервал і був ~90 хв. Пропуски самозаліковуються вікном
# `sync.py --since 2d`, губиться лише свіжість, не дані.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:          # кнопка «запустити зараз» у вкладці Actions
  push:
    branches: [main]

permissions:
  contents: write             # щоб бот міг комітити оновлені дані
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false   # не обривати збір на півдорозі

jobs:
  build:
    runs-on: ubuntu-latest
    # Крок збору ходить у мережу й повторює запити з backoff — єдине місце, що
    # може зависнути надовго. Виміряно локально: тести 7 с, збірка сайту 28 с,
    # ранжування <1 с. Двадцять хвилин — десятикратний запас, але менше за
    # інтервал крону (година), тому зависла спроба звільнить чергу до наступної.
    # Дефолт GitHub — 360 хв, і з `cancel-in-progress: false` одна зависла
    # спроба блокувала б групу на шість годин.
    timeout-minutes: 20
    # Бот комітить дані в main, а `on: push` реагує на main. Зараз петлі нема:
    # GitHub не перезапускає workflow на події від GITHUB_TOKEN. Але варто
    # замінити токен на PAT чи deploy key (типово — коли вмикають захист гілки),
    # і кожен коміт бота запускав би нову збірку. Явна умова не залежить від
    # цієї неочевидної поведінки.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Газетир 132 МБ — у репозиторії йому не місце. Кешуємо між запусками,
      # завантажуємо лише коли кеш порожній.
      - name: Кеш газетира
        id: gaz
        uses: actions/cache@v4
        with:
          path: gazetteer
          key: gazetteer-v1

      - name: Завантажити газетир
        if: steps.gaz.outputs.cache-hit != 'true'
        run: |
          mkdir -p gazetteer && cd gazetteer
          curl -sL -o RU.zip https://download.geonames.org/export/dump/RU.zip
          curl -sL -o UA.zip https://download.geonames.org/export/dump/UA.zip
          curl -sL -o ne.zip https://naciscdn.org/naturalearth/10m/cultural/ne_10m_admin_1_states_provinces.zip
          unzip -oq RU.zip && unzip -oq UA.zip && unzip -oq ne.zip
          rm -f *.zip

      - name: Межі областей
        run: test -f regions.json || python mkregions.py

      # Тести — до збору. Якщо розбір зламано, краще не писати зіпсовані події
      # у store і не публікувати сайт: дані в data/ не відновлюються.
      - name: Тести
        run: python -m unittest discover -s tests -t . -v

      - name: Зібрати нові пости
        run: python sync.py --since 2d

      # Без цього кроку жар цілей замерзав на останньому ручному запуску:
      # події накопичувались щодня, а hits/imp лишались старими.
      # Обовʼязково ПІСЛЯ sync (рахує з подій) і ДО site (копіює файл у сайт).
      # Результат свідомо НЕ комітиться: hits змінюється майже щоразу, а файл
      # важить 0.8 МБ — 24 запуски на добу дали б ~20 МБ/добу в історію git.
      # У репозиторії лишається база обʼєктів з fetch_targets, свіже ранжування
      # живе лише в опублікованому site/targets.json.
      - name: Перерахувати важливість цілей
        run: |
          if [ -f targets.json ]; then
            python rank_targets.py
          else
            echo "targets.json нема — пропускаю, карти будуть без шару цілей"
          fi

      - name: Зібрати сайт
        run: python site.py --days 10 --raids

      - name: Зберегти дані в репозиторій
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data store regions.json
          git diff --staged --quiet || git commit -m "дані: $(date -u +%F\ %H:%M) UTC"
          git push

      # Публікація на Netlify, а не GitHub Pages: безкоштовний Pages роздає лише
      # з публічного репозиторію, а тут у `data/` лежать сирі пости й уся логіка
      # відбору — репозиторій лишається приватним.
      #
      # Netlify тут НЕ звʼязаний з Git. Звʼязка через дашборд виглядає простіше,
      # але робить дві шкідливі речі: (1) `site/` у .gitignore, тому Netlify
      # публікує корінь репо — тобто віддає приватні дані по HTTP; (2) білд на
      # кожен push, а бот комітить дані 24 рази на добу — 300 безкоштовних
      # хвилин білду вичерпуються за кілька днів. Тека їде готовою звідси, де
      # вже є Python, газетир і store.
      #
      # Публікація вимкнена, доки не ввімкнеш явно:
      #   gh variable set PUBLISH_SITE --body true
      # Без умови кожен прогін без секретів був би червоним, і справжній збій
      # загубився б серед них.
      - name: Публікація на Netlify
        if: vars.PUBLISH_SITE == 'true'
        run: npx --yes netlify-cli@17 deploy --prod --dir=site --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
