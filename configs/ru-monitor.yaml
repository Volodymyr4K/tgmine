name: ru-monitor
# Російські моніторингові канали (напр. lpr1_treugolnik) — дзеркало ua-air.
# Формат поста: рядок 1 — географія, рядок 2 — тип загрози.
#   "Енакиево, Юнком ДНР и близлежащие\nТревога по БПЛА Хорнет"

tags:
  БПЛА:     ["БПЛА", "БпЛА", "дрон\\w*", "б\\/?п\\b"]
  УАБ:      ["\\bУАБ\\b", "\\bКАБ\\b", "авиационн\\w* ракетно бомбов\\w*", "авиабомб\\w*"]
  # (?!...) — щоб "авиационная ракетно бомбовая опасность" не вмикала ще й
  # тег «ракета»: це УАБ, і без винятку кореляція УАБ↔ракета стає фіктивною
  ракета:   ["ракет(?!но[ -]бомбов)(?!ная бомбов)(?!но бомбов)\\w*", "Нептун", "Фламинго", "Гром", "Точка-У", "баллистик\\w*"]
  РСЗО:     ["РСЗО", "Хаймарс", "HIMARS", "Ольха", "Вампир"]
  тривога:  ["Тревога"]
  небезпека: ["Опасность"]
  відбій:   ["Отбой"]
  ударний:  ["Ударн\\w*", "в направлении"]

# Моделі БпЛА — окремий вимір, показує чим саме працюють
entities:
  тип_бпла:
    Хорнет:  ["Хорнет", "Hornet"]
    Дартс:   ["Дартс", "Darts"]
    Лютий:   ["Лютый", "Лютий"]
    Бабай:   ["Бабай"]
  регіон:
    # «Крымский район» — це Кубань, а не Крим, і \w* його забирав: 65 постів
    # за 45 діб, усі зі зведень РСЧС Краснодарського краю. Виняток вузький —
    # лише перед словом «район/округ/МО», бо «Крымский полуостров» (1377
    # згадок) і «Крымскому мосту» (600) це якраз Крим. \bМО\b з межами слова
    # обовʼязково: без них re.I збігається з «Мо» у «Крымский Мост», і 22
    # пости про міст лишались без області взагалі — спіймано заміром.
    Крим:              ["Крым(?!ск(?:ий|ом|ого)\\s+(?:район|округ|\\bМО\\b))\\w*", "Севастопол\\w*", "Симферопол\\w*", "Керч\\w*", "Джанко\\w*", "Евпатор\\w*", "Феодос\\w*", "Саки\\b"]
    # Кубанський Красноармійський район забирає собі прикметник, знятий вище з
    # ТОТ_Донецьк: без цього рядка ті 100 постів не діставались нікому або
    # їхали в Крим (у зведеннях РСЧС поруч стоїть «Крымский район» — теж
    # кубанський, а патерн Криму «Крым\w*» його бере). Виняток на 60 символів
    # уперед — бо однойменні райони є ще у Волгограді й Саратові, і там пост
    # називає своє місто одразу після назви району: «Красноармейский |
    # Волгоград», «Красноармейский район | Саратовская область». Заміряно:
    # 84 пости їдуть на Кубань, 5 у Волгоградську, 4 в Саратовську, 4 в Крим —
    # усі правильно, а 62 донецькі лишаються донецькими.
    Краснодарський:    ["Краснодарск\\w*", "Крымск\\b", "Новороссийск\\w*", "Анапа\\w*", "Сочи\\b", "Туапсе", "Ейск\\w*", "Славянск-на-Кубани", "Красноармейск(?:ий|ого|ом)(?![\\s\\S]{0,60}(?:Волгоград|Саратов))"]
    Ростовська:        ["Ростовск\\w*", "Ростов-на-Дону", "Таганрог\\w*", "Шахты\\b", "Волгодонск\\w*", "Морозовск\\w*"]
    Бєлгородська:      ["Белгородск\\w*", "Белгород\\w*", "\\bБгд\\b", "Шебекин\\w*", "Валуй\\w*", "Грайворон\\w*", "Строитель\\b"]
    Курська:           ["Курск\\w*", "Рыльск\\w*", "Льгов\\w*", "Судж\\w*", "Железногорск\\w*"]
    Брянська:          ["Брянск\\w*", "Клинц\\w*", "Новозыбков\\w*", "Стародуб\\w*"]
    Воронезька:        ["Воронежск\\w*", "Воронеж\\w*", "Борисоглебск\\w*", "Лиск\\w*", "Россош\\w*"]
    Липецька:          ["Липецк\\w*", "Елец\\w*"]
    Тульська:          ["Тульск\\w*", "Тула\\b", "Новомосковск\\w*"]
    Калузька:          ["Калужск\\w*", "Калуг\\w*", "Обнинск\\w*"]
    Московська:        ["Московск\\w*", "Москв\\w*", "Подольск\\w*", "Домодедов\\w*"]
    Саратовська:       ["Саратовск\\w*", "Саратов\\w*", "Энгельс\\w*", "Балаково"]
    # «Волжск\w*» ловив і волгоградський Волжский, і марійський Волжск
    # («Волжск, Республика Марий Эл», «Волжский район / Республика Марий Эл»):
    # 13 постів їхали у Волгоградську за 600 км, і саме через це пост про
    # Казань не знайшов Казань біля Волгограда. Лишаємо прикметникові форми
    # (місто Волжский, Волжская ГЭС — 45 постів) і виключаємо Марій Ел поруч.
    Волгоградська:     ["Волгоградск\\w*", "Волгоград\\w*", "Волжск(?:ий|ого|ому|ом|ая|ой)\\b(?![\\s\\S]{0,40}Марий)", "Камышин\\w*"]
    Орловська:         ["Орловск\\w*", "\\bОр[её]л\\b", "Ливн\\w*", "Мценск\\w*"]
    Ставропольський:   ["Ставропольск\\w*", "Ставропол\\w*", "Невинномысск\\w*"]
    Рязанська:         ["Рязанск\\w*", "Рязан\\w*"]
    Тамбовська:        ["Тамбовск\\w*", "Тамбов\\w*"]
    Смоленська:        ["Смоленск\\w*", "Смоленщин\\w*"]
    # «Дубенск\w*» знято: Дубенський район є і в Мордовії, і в Тульській, а в
    # корпусі слово трапляється лише прикметником (99 згадок) і переважно
    # тульських. 23 пости за 45 діб їхали в Мордовію замість Тульської.
    Мордовія:          ["Мордови\\w*", "Саранск\\w*"]
    Пензенська:        ["Пензенск\\w*", "Пенз\\w*"]
    Нижегородська:     ["Нижегородск\\w*", "Нижний Новгород", "Дзержинск\\w*"]
    Самарська:         ["Самарск\\w*", "Самар\\w*", "Тольятти", "Сызран\\w*", "Новокуйбышевск\\w*"]
    Ульяновська:       ["Ульяновск\\w*"]
    Астраханська:      ["Астраханск\\w*", "Астрахан\\w*"]
    Башкортостан:      ["Башкорт\\w*", "Башкири\\w*", "Уфа\\b", "Уфимск\\w*", "Стерлитамак\\w*", "Салават\\w*"]
    Удмуртія:          ["Удмурт\\w*", "Ижевск\\w*", "Воткинск\\w*"]
    # «Новотроицк\w*» знято ПОВНІСТЮ. Спершу звузили до називного відмінка —
    # і цього виявилось мало: перевірка на всьому корпусі показала, що навіть
    # «Новотроицк» без закінчення це Херсонщина в 17 випадках із 25
    # («Новотроицк, Новоалексеевка, Геническ», «Аскания Нова - Новотроицк»).
    # Форми ще гірші: «Новотроицкий» (261) — кубанський хутір, «Новотроицкое»
    # (235) — херсонське й воронезьке село, «Новотроицка» (9) — Херсонщина.
    # Оренбурзькі пости від цього не втрачають нічого: всі вісім називають
    # «Оренбургская область» або «Орск» у тому ж тексті. Разом 21 пост
    # перестає їхати за 1500 км, зламаних — нуль.
    Оренбурзька:       ["Оренбург\\w*", "Орск\\b"]
    # Області, яких бракувало. Канали про них писали, але без запису тут вони
    # провалювались у freeform як «населений пункт» — і геокодер чіпляв кубанські
    # станиці, названі на честь північних областей: «Ленинградская область» ->
    # станиця Ленінградська (46.32, 39.39), помилка ~1600 км. 454 таких згадки.
    Ярославська:       ["Ярославск\\w*"]
    Новгородська:      ["Новгородск\\w*"]
    Владимирська:      ["Владимирск\\w*"]
    Костромська:       ["Костромск\\w*"]
    Тверська:          ["Тверск\\w*"]
    # Цим двом потрібне слово «область» у збігу — інакше ловлять чуже:
    # "Ивановск\w*" бере «Ивановское Рыльского района» (Курщина, 21 збіг),
    # "Ленинградск\w*" — станицю й Ленінградський район на Кубані (14 збігів),
    # де нинішня прив'язка якраз правильна. Перевірено: строгий патерн дає
    # 134 і 87 збігів відповідно, 0 помилкових.
    Ивановська:        ["Ивановск\\w*\\s+власт", "Ивановск\\w*\\s+област\\w*"]
    Ленінградська:     ["Ленинградск\\w*\\s+област\\w*"]
    # Кіровську НЕ додано свідомо: "Кировск\w*" дає 287 збігів, з них лише 22
    # про область, а 265 — «Кировский район» і «Кировское» у Криму. Додавання
    # перекинуло б Крим у Кіровську область за 1300 км.
    # Архангельська поза межами THEATER (64.5° > 61°), газетир її не віддасть.
    Татарстан:         ["Татарстан\\w*", "Казан\\w*", "Нижнекамск\\w*", "Елабуг\\w*", "Алабуг\\w*"]
    # «Красноармейск» ТІЛЬКИ іменником. Прикметник — це чужі райони, і \w*
    # згрібав їх усі: заміряно на 45 добах, область поста визначив
    # «Красноармейск*» у 162 постах, і в 100 з них це помилка. Розклад форм:
    # «Красноармейск» 62 — Донеччина в 62 випадках із 62 («Красноармейск ДНР»,
    # «Константиновка, Красноармейск, Артемовск»); «Красноармейский» 93 —
    # Кубань у 84 («Красноармейский район, Краснодарский край» у зведеннях
    # РСЧС), плюс Волгоград і Саратов; «Красноармейское» 7 — Крим і Чувашія.
    # Той самий клас, що вже описаний нижче для «Ивановск» і «Ленинградск».
    ТОТ_Донецьк:       ["\\bДНР\\b", "\\bЛДНР\\b", "Донецк\\w*", "Горловк\\w*", "Енакиев\\w*", "Макеевк\\w*", "Мариупол\\w*", "Углегорск", "Юнком", "Родинское", "Красноармейск(?:а|у|е)?\\b", "Белицкое", "Ясиноват\\w*", "Торез", "Снежное", "Шахтерск"]
    # «Луганское» (середній рід) — це три села: під Джанкоєм у Криму, під
    # Дебальцевим на Донеччині й у Саратовській області. Луганщина — жодне.
    # 24 пости за весь корпус їхали в ЛНР; після винятку 12 у Крим, 8 у ДНР,
    # 1 у Саратовську. Решта форм лишаються: «Станица Луганская» (101) і
    # «Луганской Народной Республики» — справді Луганщина.
    ТОТ_Луганськ:      ["\\bЛНР\\b", "\\bЛнр\\b", "Луганск(?!ое\\b)\\w*", "Алчевск\\w*", "Стаханов\\w*", "Свердловск(?:а|у|е)?\\b", "Ровеньки", "Красный Луч", "Троицкое", "Сватов\\w*", "Старобельск\\w*"]
    ТОТ_Запоріжжя:     ["Запорожск\\w*", "Мелитопол\\w*", "Бердянск\\w*", "Энергодар\\w*", "Токмак\\w*", "Приморск\\b"]
    ТОТ_Херсон:        ["Херсонск\\w*", "Геническ\\w*", "Скадовск\\w*", "Новая Каховка", "Каховк\\w*", "Чаплынк\\w*"]

# Населених пунктів сотні — перелічити нереально. Беремо з великої літери
# з першого рядка (там завжди географія), решту відсіює стоплист.
freeform:
  нп:
    # Негативний lookahead відсуває збіг із прийменника чи прислівника на
    # саму назву. «От Белой Березки группа БПЛА» описує спостереження БІЛЯ
    # Білої Березки — це валідне місце події, а не чуже джерело (перевірено
    # на 692 постах: рядок завжди має вигляд «От <тут> у напрямку <туди>»).
    # Без lookahead вікно з двох слів зʼїдав прийменник: «От Белой» замість
    # «Белой Березки», тобто назва ще й усікалась.
    pattern: "\\b(?!(?:От|Из|Над|Под|За|Севернее|Южнее|Западнее|Восточнее|Северней|Южней|Западней|Восточней)\\b)[А-ЯЁ][а-яё]+(?:-[А-ЯЁа-яё]+)*(?:\\s+[А-ЯЁ][а-яё]+)?"
    lines: 1
    min_len: 4
    stoplist:
      - Опасность
      - Тревога
      - Отбой
      - Ударный
      - Внимание
      - Воздушная
      - Авиационная
      - Ракетная
      - Угроза
      - Область
      - Республика
      - Район
      - Край
      - Город
      - Поселок
      - Село
      - Направление
      - Близлежащие
      # Напрямки, не населені пункти. Канали починають рядок з напрямку
      # ("Центральные районы Крыма", "Запад Крыма", "Юго-Восток / Московская
      # область"), а шаблон бачив слово з великої й брав його за назву НП.
      # Сім із них ще й РЕЗОЛВИЛИСЬ у газетирі — 90 згадок отримували вигадану
      # точку: "Центральные" -> село Центральний (47.10, 37.55).
      # Збіг точний, у нижньому регістрі, тому справжні назви з тим самим
      # коренем не зачеплені: Северск, Северский, Северодонецк, Северный
      # Кавказ, Северная Осетия, Западнодвинский — усі лишаються.
      - Север
      - Юг
      - Восток
      - Запад
      - Центр
      - Северный
      - Северная
      - Северное
      - Северной
      - Северного
      - Северо
      - Южный
      - Южная
      - Южное
      - Южной
      - Восточный
      - Восточная
      - Восточное
      - Восточные
      - Востока
      - Западный
      - Западная
      - Западное
      - Западные
      - Центральные
      - Северо-Восток
      - Северо-Запад
      - Северо-восточные
      - Юго-Восток
      - Юго-восток
      - Юго-Запад
      - Юго-запад
      - Юго-Западная
      - Юго-восточная
      - Пролет
      - Работает
      - Взрыв
      - Взрывы
      - Отменена
      - Объявлена
      - Повторно
      - Массированная
      - Соблюдаем
      - Много
      - Продолжаем
      - Информация
      - Уточняем
      - Осторожно
      - Также
      - Возможно
      - Сейчас
      - Наблюдаем
      - Азовского
      - Черного
      - Одессы
      - Николаева
      - Самолет
      - Самолёт
      - Дальний
      - Движение
      - Пуски
      - Противник
      - Группа
      - Дорогие
      - Экстренная
      - Штормам
      - Просим
      - Кубани
      - Дону

# Не-бойовий контент: збори, донати, реклама каналу, вербування.
# Позначається як noise і ховається з публічних сторінок, але ЗАЛИШАЄТЬСЯ
# у сховищі — видаляти чужі дані ми не маємо права, лише не показувати.
noise:
  - "https?://[^\\s]*(?:pay|qiwi|sber|tinkoff|yoomoney|boosty|patreon)"
  - "\\bсбор[ае]?\\b|собрано\\s|реквизит|донат|перевод\\s+на\\s+карт"
  - "\\d[\\d\\s.,]{3,}\\s*(?:руб|₽)"
  - "поддерж\\w+\\s+(?:канал|нашу\\s+работу|радар)|поддержка\\s+канала"
  - "спасибо\\s+(?:вам\\s+)?за\\s+поддержк|благодар\\w+\\s+за\\s+поддержк"
  - "подписыва\\w+|подпишись|наш\\s+резервный\\s+канал"
  - "служба\\s+по\\s+контракту|военная\\s+служба\\s+по\\s+контракту|единый\\s+центр"
  - "дорогие\\s+(?:наши\\s+)?(?:близкие|друзья)"
  - "маскировочн\\w+\\s+сет|плетени[ея]|производство\\s+СИЗ"
  - "реклам\\w+"
  # промо інших каналів і запрошення в чати
  - "отдельн\\w+\\s+канал\\w*\\s+оповещени"
  - "max\\.ru/join|t\\.me/joinchat|t\\.me/\\+"
  - "выйти\\s+с\\s+нами\\s+на\\s+связь|просим\\s+служб"
  - "ищем\\s+(?:админа|человека|в\\s+команду)|нужен\\s+ещ[её]\\s+один\\s+человек"
  # УВАГА: по голому @нікнейму не фільтруємо — ним підписані СПРАВЖНІ тривоги
  # ("Горловка. Повышенная опасность атаки БПЛА / @Prikhodko1970")

modifier_scope: 25
modifiers:
  північ:  ["северн\\w*(?![- ]в)(?![- ]з)", "\\bсевер\\b", "с севера"]
  південь: ["южн\\w*(?![- ]в)(?![- ]з)", "\\bюг\\b", "с юга"]
  схід:    ["восточн\\w*", "\\bвосток\\b", "с востока"]
  захід:   ["западн\\w*", "\\bзапад\\b", "с запада"]
  північно-схід: ["северо[- ]восточн\\w*", "северо[- ]восток"]
  північно-захід: ["северо[- ]западн\\w*", "северо[- ]запад"]
  південно-схід: ["юго[- ]восточн\\w*", "юго[- ]восток"]
  південно-захід: ["юго[- ]западн\\w*", "юго[- ]запад"]

# Ручні виправлення геокодування: топоніми, яких GeoNames не знає під тією
# назвою, що вживають канали. «ГО Богородск» — це Ногінськ у Підмосков'ї, але
