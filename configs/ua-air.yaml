name: ua-air
# Повітряні загрози в українських моніторингових каналах.
# Усі патерни — regex, регістр ігнорується.

tags:
  КАБ:    ["КАБ", "керован\\w* авіабомб\\w*", "УМПК"]
  БпЛА:   ["БпЛА", "БПЛА", "безпілотн\\w*", "дрон\\w*", "шахед\\w*", "Shahed", "герань", "Гербер\\w*"]
  ракета: ["ракет\\w*", "Іскандер", "Кинджал", "Кинжал", "Калібр", "Х-\\d+", "С-300", "С-400", "балістик\\w*", "крилат\\w*"]
  авіація: ["МіГ-\\d+", "Ту-\\d+", "Су-\\d+", "тактичн\\w* авіаці\\w*"]
  збиття:  ["збит\\w*", "знищен\\w*", "ліквідован\\w*"]

# Який тег визначає блок для витягу сутностей. Пости-зведення містять кілька
# загроз; без цього географія одного блоку тече в інший.
segment_by: КАБ
block_break: ["^[\\U0001F300-\\U0001FAFF]"]   # рядок, що починається з емодзі = новий блок

# Слова-джерела ("КАБи З Донеччини на...") — щоб не рахувати як ціль.
# Зведення з секціями: "- Запорізька область:" ... "КАБи на область."
header_pattern: "^[-–]?\\s*([А-ЯЇІЄҐ][\\w'-]+(?:\\s+область)?)\\s*:"
anaphora: ["\\bна\\s+(?:область|обл\\.)"]

source_markers: ["\\b(?:з|із|зі)\\s+[А-ЯЇІЄҐ][\\w'-]*"]

modifier_scope: 30
modifiers:
  північ:        ["північн\\w*(?![- ]сх)(?![- ]за)", "\\bпівніч\\b", "півноч\\w*"]
  південь:       ["південн\\w*(?![- ]сх)(?![- ]за)", "\\bпівдень\\b", "півдн\\w*"]
  схід:          ["східн\\w*", "\\bсхід\\b", "сход\\w*"]
  захід:         ["західн\\w*", "\\bзахід\\b", "заход\\w*"]
  північно-схід: ["північн\\w*[- ]сх\\w*", "півн\\w*[- ]сх\\w*"]
  північно-захід: ["північн\\w*[- ]зах\\w*", "півн\\w*[- ]зах\\w*"]
  південно-схід: ["південн\\w*[- ]сх\\w*", "півд\\w*[- ]сх\\w*"]
  південно-захід: ["південн\\w*[- ]зах\\w*", "півд\\w*[- ]зах\\w*"]

entities:
  область:
    Запорізька:       ["Запорізьк\\w*", "Запоріжж\\w*", "Кушугум\\w*", "Комишувах\\w*", "Оріхів\\w*", "Вільнянськ\\w*"]
    Донецька:         ["Донеччин\\w*", "Донецьк\\w*", "Краматорськ\\w*", "Слов'янськ\\w*", "Покровськ\\w*"]
    Харківська:       ["Харківщин\\w*", "Харківськ\\w*", "Харків\\w*", "Ізюм\\w*", "Куп'янськ\\w*", "Чугуїв\\w*"]
    Дніпропетровська: ["Дніпропетровщин\\w*", "Дніпропетровськ\\w*", "Дніпр\\w*", "Нікопол\\w*", "Павлоград\\w*", "Кривий Ріг", "Криворізьк\\w*"]
    Сумська:          ["Сумщин\\w*", "Сумськ\\w*", "\\bСум\\w*", "Шостк\\w*", "Конотоп\\w*"]
    Херсонська:       ["Херсонщин\\w*", "Херсонськ\\w*", "Херсон\\w*"]
    Чернігівська:     ["Чернігівщин\\w*", "Чернігівськ\\w*", "Чернігів\\w*", "Ніжин\\w*"]
    Полтавська:       ["Полтавщин\\w*", "Полтавськ\\w*", "Полтав\\w*", "Кременчу\\w*"]
    Миколаївська:     ["Миколаївщин\\w*", "Миколаївськ\\w*", "Миколаїв\\w*"]
    Одеська:          ["Одещин\\w*", "Одеськ\\w*", "Одес\\w*", "Ізмаїл\\w*"]
    Луганська:        ["Луганщин\\w*", "Луганськ\\w*"]
    Київська:         ["Київщин\\w*", "Київськ\\w*", "\\bКиїв\\w*"]
    Кіровоградська:   ["Кіровоградщин\\w*", "Кіровоградськ\\w*", "Кропивниць\\w*"]
    Черкаська:        ["Черкащин\\w*", "Черкаськ\\w*", "Черкас\\w*"]
    Житомирська:      ["Житомирщин\\w*", "Житомирськ\\w*", "Житомир\\w*"]
    Вінницька:        ["Вінниччин\\w*", "Вінницьк\\w*", "Вінниц\\w*"]
    Хмельницька:      ["Хмельниччин\\w*", "Хмельницьк\\w*"]
    Рівненська:       ["Рівненщин\\w*", "Рівненськ\\w*", "\\bРівн\\w*"]
    Волинська:        ["Волин\\w*", "Луцьк\\w*"]
    Львівська:        ["Львівщин\\w*", "Львівськ\\w*", "Львів\\w*"]

