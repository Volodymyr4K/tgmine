# Годинник для конвеєра. Лежить у підтеці навмисно: `wrangler pages deploy`
# у workflow запускається з кореня репозиторію, і wrangler.toml у корені він
# підхопив би як конфіг Pages-проєкту.
name = "tgmine-cron"
main = "src/index.js"
compatibility_date = "2026-07-24"

# Публічної адреси у цього Worker бути не повинно. Він має лише обробник
# `scheduled`, тож workers.dev-URL віддає 500 (error code 1101) — але це все
# одно зайва поверхня на скрипті, який тримає токен GitHub із правом запису.
# Без цих двох рядків wrangler вмикає і те, і те за замовчуванням.
workers_dev = false
preview_urls = false

# Інтервал — єдине місце, де він задається. У workflow лишається `schedule`
# раз на 6 годин як запобіжник на випадок смерті цього Worker.
#
# Скільки можна собі дозволити: приватний репозиторій має 2000 безкоштовних
# хвилин Actions на місяць, прогін триває ~72 с і тарифікується як 2 хвилини
# (GitHub округлює вгору). Тобто:
#   щогодини    — 24/добу × 2 хв × 30 = 1440 хв/міс (72% ліміту)  ← обрано
#   раз на 45 хв — 32/добу = 1920 хв/міс (96%, нуль запасу на ручні прогони)
#   раз на 30 хв — 48/добу = 2880 хв/міс, перебір 880 хв ≈ $7/міс
[triggers]
crons = ["0 * * * *"]

[vars]
GH_REPO = "Volodymyr4K/tgmine"
GH_WORKFLOW = "update.yml"
GH_REF = "main"

# GH_TOKEN кладеться окремо й у файл не потрапляє:
#   npx wrangler secret put GH_TOKEN
